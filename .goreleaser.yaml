# GoReleaser configuration (https://goreleaser.com).
#
# hokora targets Linux servers only (mlockall / unix sockets / systemd), so the
# release builds Linux amd64 / arm64. modernc.org/sqlite is pure Go, so CGO is
# off and the binaries are static.
#
# Two binaries ship in two separate archives:
#   hokora         — the server (links SQLite + argon2)
#   hokora-client  — the app-host client (standard library only)
#
# GoReleaser is pinned in tools/release/go.mod. Validate locally with:
#   make goreleaser-check
#
# GoReleaser only builds: kan/tagpr-scripts' build-go.yml (called from
# release.yml) runs it with --skip=publish, and release-go.yml creates the
# GitHub release from the files in dist/, so the build runs without the
# permission to write to the repository.
#
# The build is reproducible: the same tag gives the same archives. Timestamps
# come from the commit, not from the clock.
#
# vX.Y.Z and the SDK module's sdk/vX.Y.Z sit on the same commit. build-go.yml
# names the version with GORELEASER_CURRENT_TAG. git.ignore_tags cannot do
# this: v2.20.0 compares its entries exactly, so a glob such as "sdk/*" does
# not keep the SDK tag out when GoReleaser picks the tag at HEAD.
version: 2

project_name: hokora

# Nothing here changes the tree: a release builds what the tag holds. CI
# checks that go.mod and go.sum are tidy (make tidy-check).
before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: hokora
    main: .
    binary: hokora
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: hokora-client
    main: ./cmd/hokora-client
    binary: hokora-client
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

# Files would otherwise carry the time of the checkout, and the user and umask
# of whoever ran the build. CREDITS holds the licenses of the root module's
# dependencies (the whole module graph, so more than either binary links; NOTICE
# lists what each one links). The release PR refreshes it (release-prepare.mjs --credits)
# and build-go.yml checks it before building.
archives:
  - id: hokora
    ids: [hokora]
    name_template: "hokora_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: &reproducible_binary
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &reproducible_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info: *reproducible_info
      - src: CREDITS
        info: *reproducible_info
      - src: README.md
        info: *reproducible_info
      - src: docs/OPERATIONS.md
        info: *reproducible_info
      - src: docs/THREAT_MODEL.md
        info: *reproducible_info

  - id: hokora-client
    ids: [hokora-client]
    name_template: "hokora-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: *reproducible_binary
    files:
      - src: LICENSE
        info: *reproducible_info
      - src: NOTICE
        info: *reproducible_info
      - src: CREDITS
        info: *reproducible_info
      - src: README.md
        info: *reproducible_info

# Keep this name: build-go.yml attests the archives listed in
# dist/checksums.txt, and release-go.yml uploads them.
checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# GoReleaser only builds (build-go.yml runs it with --skip=publish). The release
# notes are the CHANGELOG.md section of the version, which build-go.yml
# extracts and release-go.yml passes to gh release create.
changelog:
  disable: true
