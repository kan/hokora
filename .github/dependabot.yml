version: 2

# GitHub Actions は .github/workflows/actions.lock(workflow lockfile)で
# commit に固定する(タグは書き換えられるため)。uses: は完全な版のタグで書く。
# Dependabot は actions の更新 PR で uses: と lockfile の該当エントリを
# 一緒に作り直す。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # tagpr.yml が呼ぶ kan/tagpr-scripts の共通の workflow の SHA は、
      # scripts/tagpr/ の subtree と揃える。subtree pull と同じ PR でだけ上げ、
      # Dependabot には上げさせない(tagpr-scripts の README「The tagpr workflow」)
      - dependency-name: kan/tagpr-scripts*

  # サーバー本体の依存(root の go.mod)。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # 開発ツール(tools/go.mod)。**directory は module ごとに書く。** `/` の
  # 指定は tools/ の別 module を見ないため、分離した時点から golangci-lint と
  # govulncheck の更新が来なくなり、古い golangci-lint が新しい Go の
  # export data を読めず lint が落ちるまで気付けなかった。
  # sdk/ は依存ゼロなので対象に入れない。
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    # tools/go.mod の require は、tool ディレクティブで使うツール本体を含めて
    # 全て `// indirect` である。Dependabot の既定は direct だけを更新するので、
    # 明示しないと directory を足しても PR が来ない。ツール本体だけを対象にし、
    # 推移的依存はツールの更新に付いてくる分に任せる。
    allow:
      - dependency-name: github.com/golangci/golangci-lint/v2
        dependency-type: all
      - dependency-name: golang.org/x/vuln
        dependency-type: all
    groups:
      # ツールとその推移的依存はバイナリに入らないため、まとめて 1 つの PR にする。
      dev-tools:
        patterns:
          - "*"

  # リリースのツール(tools/release/go.mod の goreleaser)。lint / vuln と
  # build list を共有させないための別 module なので、PR も別に来る。
  # require が全て `// indirect` なのは tools/ と同じ。
  - package-ecosystem: gomod
    directory: /tools/release
    schedule:
      interval: weekly
    allow:
      - dependency-name: github.com/goreleaser/goreleaser/v2
        dependency-type: all
    groups:
      release-tools:
        patterns:
          - "*"

# Go 本体(go.mod の toolchain 行)は Dependabot が上げない。
# toolchain.yml(make toolchain-latest)が定期に検査する。
