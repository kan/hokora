name: release

# tagpr.yml が、tagpr の打ったタグを ref にして workflow_dispatch で起動する
# (GITHUB_TOKEN で push したタグでは push が起動しない)。push のトリガは、
# 手で打ったタグのためにある。どちらでも github.ref はタグである。
#
# build ジョブが GoReleaser で Linux amd64/arm64 の 2 バイナリをビルドし
# (.goreleaser.yaml)、publish ジョブが CHANGELOG の節を本文にして Release を作る。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 権限は各ジョブに書く。
permissions:
  contents: read

# タグごとに 1 つ。止めない(Release を作っている途中で止まると、
# 半端な Release が残る)。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # リポジトリへの書き込み権限を持たずにビルドする。
  build:
    # workflow_dispatch はブランチでも起動できるが、リリースはタグでだけ行う。
    # publish はこのジョブに依存するので、この条件が両方を守る。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # タグ(sdk/vX.Y.Z を含む)を取る
          persist-credentials: false

      # **sdk タグを打たずにサーバーだけリリースすると、利用側の
      # `go get github.com/kan/hokora/sdk` が壊れる**(AGENTS.md「リリースは
      # タグが 2 系統になる」)。打ち忘れを沈黙させないよう、同じ番号の sdk タグが
      # 同じコミットにあるかを検査する。sdk タグは tagpr.yml の sdk-tag ジョブが打つ。
      - name: sdk タグの検査
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! sdk_commit="$(git rev-parse -q --verify "refs/tags/sdk/$TAG^{commit}")"; then
            echo "::error::sdk/$TAG タグが無い。tagpr.yml の sdk-tag ジョブの結果を確かめること"
            echo "(AGENTS.md「リリースはタグが 2 系統になる」を参照)"
            exit 1
          fi
          srv_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          echo "sdk/$TAG=$sdk_commit  $TAG=$srv_commit"
          if [ "$sdk_commit" != "$srv_commit" ]; then
            echo "::error::sdk/$TAG と $TAG が別コミットを指している"
            exit 1
          fi

      # publish ジョブはこの節から Release の本文を作る。タグの節が無ければ、
      # ビルドの前にここで止める。
      - name: CHANGELOG の節の検査
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/tagpr/release-notes.mjs "$TAG" > /dev/null

      # キャッシュを使わない。別のワークフローが書いたキャッシュを、リリースの
      # バイナリに届かせない。
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # 「設定した」ではなく「効いている」を確かめる。setup-go は go.mod の
      # `toolchain` 行を優先して入れる。リリース成果物が宣言どおりの処理系で
      # ビルドされることを固定する。
      - name: toolchain
        run: make toolchain-check

      # GoReleaser の版は tools/release/go.mod で固定し、go.sum で確かめる。
      # Release の作成は publish ジョブに任せる。本文は GoReleaser ではなく
      # CHANGELOG.md から作る。
      #
      # 同じコミットに sdk/vX.Y.Z もあるので、版を明示する(.goreleaser.yaml の
      # 冒頭。git.ignore_tags の glob では外せない)。
      - name: build
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: |
          make bin/goreleaser
          bin/goreleaser release --clean --skip=publish

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 1
          if-no-files-found: error

  # build ジョブの成果物から Release を作る。ここでは何もビルドしない。
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release の作成
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # scripts/tagpr/release-notes.mjs と CHANGELOG.md のため
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-dist
          path: dist

      # その版の CHANGELOG.md の節(プレリリースなら Unreleased)。build ジョブが
      # 節の有無を確かめてある。
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/tagpr/release-notes.mjs "$TAG" > "$notes"
          gh release create "$TAG" --verify-tag --prerelease="$PRERELEASE" \
            --title "$TAG" --notes-file "$notes" \
            dist/*.tar.gz dist/checksums.txt
