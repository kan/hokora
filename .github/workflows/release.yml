name: release

# tagpr.yml が、tagpr の打ったタグを ref にして workflow_dispatch で起動する
# (GITHUB_TOKEN で push したタグでは push が起動しない)。push のトリガは、
# 手で打ったタグのためにある。どちらでも github.ref はタグである(build provenance
# がこれを記録する)。
#
# ビルドと Release は kan/tagpr-scripts の共通の workflow(scripts/tagpr/.github/workflows/
# がその写し)。検査すること、入力、再実行の仕方は tagpr-scripts の README の
# 「The Go release workflows」。
#
#   sdk-tag(この repo) -> build(build-go.yml) -> release(release-go.yml)
#
# - build-go.yml がタグと CHANGELOG と CREDITS を確かめ(読み取りだけ)、走っている Go が
#   go.mod の toolchain 行と同じかを確かめ、GoReleaser で Linux amd64/arm64 の 2 バイナリを
#   ビルドして attestation を付ける(.goreleaser.yaml)。GORELEASER_CURRENT_TAG にタグを
#   渡すので、同じコミットの sdk/vX.Y.Z は版に使われない
# - release-go.yml が CHANGELOG の節を本文にして Release を draft で作り、公開する
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 権限は各ジョブに書く。
permissions:
  contents: read

# タグごとに 1 つ。止めない(Release を作っている途中で止まると、
# 半端な Release が残る)。共通の workflow は concurrency を持たない。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # **sdk タグを打たずにサーバーだけリリースすると、利用側の
  # `go get github.com/kan/hokora/sdk` が壊れる**(AGENTS.md「リリースは
  # タグが 2 系統になる」)。打ち忘れを沈黙させないよう、同じ番号の sdk タグが
  # 同じコミットにあるかを検査する。sdk タグは tagpr.yml の sdk-tag ジョブが打つ。
  #
  # make toolchain-check もここで走らせる。build-go.yml が見るのは、走っている Go と
  # root の go.mod の toolchain 行が同じかだけで、toolchain 行が無いことと、
  # SUBMODULES(sdk/、tools/、tools/release/)の go.mod のずれは見ない。
  sdk-tag:
    name: Check the SDK tag and the toolchain
    # workflow_dispatch はブランチでも起動できるが、リリースはタグでだけ行う。
    # ほかのジョブはすべてこのジョブに依存する(共通の workflow も同じ条件を持つ)。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # sdk/vX.Y.Z のタグを取る
          persist-credentials: false

      - name: sdk タグの検査
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! sdk_commit="$(git rev-parse -q --verify "refs/tags/sdk/$TAG^{commit}")"; then
            echo "::error::sdk/$TAG タグが無い。tagpr.yml の sdk-tag ジョブの結果を確かめること"
            echo "(AGENTS.md「リリースはタグが 2 系統になる」を参照)"
            exit 1
          fi
          srv_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          echo "sdk/$TAG=$sdk_commit  $TAG=$srv_commit"
          if [ "$sdk_commit" != "$srv_commit" ]; then
            echo "::error::sdk/$TAG と $TAG が別コミットを指している"
            exit 1
          fi

      # キャッシュを使わない。go version を見るだけで、依存は取ってこない。
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: toolchain
        run: make toolchain-check

  # SHA は scripts/tagpr/ に取り込んだ tagpr-scripts の commit で、tagpr.yml と同じにする
  # (verify-subtree.mjs がこれらの行も照合する)
  build:
    needs: sdk-tag
    uses: kan/tagpr-scripts/.github/workflows/build-go.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: read
      id-token: write           # attestation の署名に使う Sigstore の証明書
      attestations: write       # build provenance の attestation の保存
      artifact-metadata: write  # attestation を付けた成果物の記録

  release:
    needs: build
    uses: kan/tagpr-scripts/.github/workflows/release-go.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: write  # Release の作成と公開
    with:
      prerelease: ${{ needs.build.outputs.prerelease }}
