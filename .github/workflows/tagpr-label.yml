name: tagpr-label

# リリース PR のラベル(tagpr:minor など)を付け外ししたら、リリース PR を draft にし、
# tagpr.yml を workflow_dispatch で起動して今のラベルの版に作り直す。中身は kan/tagpr-scripts の
# 共通の workflow(scripts/tagpr/.github/workflows/tagpr-label.yml がその写し)。何も checkout
# しない。扱いは tagpr-scripts の README の「The tagpr workflow」。
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read

jobs:
  rebuild:
    # **SHA は tagpr.yml の呼ぶ行と同じにする**(AGENTS.md「scripts/tagpr」)。
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@acd6fdd62871cc7acc6c33fc7e1ceb314e82e428
    permissions:
      actions: write        # tagpr.yml の起動
      pull-requests: write  # リリース PR を draft にする
