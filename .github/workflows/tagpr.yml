name: tagpr

# リリース PR を最新に保ち、マージされたらリリースを始める。設定は .tagpr、
# 手順は AGENTS.md「リリース手順」。
#
# tagpr のジョブの中身は kan/tagpr-scripts の共通の workflow
# (scripts/tagpr/.github/workflows/tagpr.yml がその写し)。動き、入力、落ちたときの
# 扱いは tagpr-scripts の README の「The tagpr workflow」。
#
# - master への push のたびに、リリース PR(ブランチ tagpr-from-v<前の版>)を
#   master の上に作り直す。CHANGELOG の節は scripts/tagpr/release-prepare.mjs が
#   書き換える。落ちた run と成功した run でのリリース PR の扱い(draft と ready、
#   前のリリース PR を閉じること)は、上の README の節にある。
# - リリース PR がマージされると、次の run がマージコミットに annotated の vX.Y.Z を
#   打ち、sdk-tag ジョブが同じコミットに sdk/vX.Y.Z を打ち、release ジョブが
#   そのタグで release.yml を起動する。
# - workflow_dispatch はリリース PR を作り直す。リリース PR のラベル(tagpr:minor など)を
#   付け外ししたときは、tagpr-label.yml がこれで起動する。名前と workflow_dispatch を変えない。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# **この workflow に concurrency を付けない。** 共通の workflow の tagpr のジョブが
# run を 1 つずつ並べる。呼ぶ側に同じ名前の group を付けると GitHub が deadlock として
# 止め、別の名前でも、待っている run を置き換える場所が 2 つに増える。
jobs:
  tagpr:
    # **SHA は scripts/tagpr/ に取り込んだ tagpr-scripts の commit にする。** subtree を
    # 取り込む PR で一緒に上げる(AGENTS.md「scripts/tagpr」)。別の repo の reusable
    # workflow は actions.lock では固定されず、Dependabot には上げさせない(dependabot.yml)
    uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@231fe768bce55eb24fed1e10a4b27907ebf7a306
    # 共通の workflow が使える権限の上限。4 つとも書く。actions: write は共通の
    # workflow の release ジョブの宣言のためで、release-workflow が空なのでそのジョブは
    # 走らない。足りないと、run が始まる前に権限の検査で落ちる
    permissions:
      contents: write       # リリース PR のブランチとタグの push
      pull-requests: write  # リリース PR の作成と更新
      issues: read          # ラベルの読み取り
      actions: write        # 上の注記
    # release.yml は sdk/vX.Y.Z の後に起動するので、共通の workflow には起動させない
    # (下の release ジョブが起動する)
    with:
      release-workflow: ''

  # tagpr は vX.Y.Z しか打たないので、ここで同じコミットに sdk/vX.Y.Z を打つ
  # (AGENTS.md「リリースはタグが 2 系統になる」)。再実行してよい。既に同じ
  # コミットにあれば何もせず、別のコミットにあれば止める。
  sdk-tag:
    name: Tag the SDK module
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # sdk/vX.Y.Z の作成
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tagpr.outputs.tag }}
    # checkout しない。タグは API で作る(書き込みのトークンを git に渡さない)。
    steps:
      - name: Create sdk/${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::想定していないタグ: $TAG"; exit 1 ;;
          esac
          sdk_tag="sdk/$TAG"

          # タグの ref が指すコミット。注釈付きのタグなら、タグのオブジェクトを
          # たどってコミットを得る。
          commit_of() {
            local out type sha
            out="$(gh api "repos/$GH_REPO/git/ref/tags/$1" \
              --jq '.object.type + " " + .object.sha')" || return 1
            read -r type sha <<<"$out"
            if [ "$type" = tag ]; then
              out="$(gh api "repos/$GH_REPO/git/tags/$sha" \
                --jq '.object.type + " " + .object.sha')" || return 1
              read -r type sha <<<"$out"
            fi
            if [ "$type" != commit ]; then
              echo "::error::$1 がコミットを指していない ($type)" >&2
              return 1
            fi
            echo "$sha"
          }

          commit="$(commit_of "$TAG")"
          echo "$TAG=$commit"

          if gh api "repos/$GH_REPO/git/ref/tags/$sdk_tag" --silent 2>/dev/null; then
            existing="$(commit_of "$sdk_tag")"
            if [ "$existing" = "$commit" ]; then
              echo "$sdk_tag は既に $commit にある"
              exit 0
            fi
            echo "::error::$sdk_tag が別のコミット ($existing) を指している。$TAG は $commit"
            exit 1
          fi

          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$sdk_tag" -f sha="$commit" --silent
          echo "$sdk_tag=$commit を作成した"

  # GITHUB_TOKEN で push したタグではワークフローが起動しないが、
  # workflow_dispatch はこの制約の対象外である。タグを ref にして起動すると
  # github.ref が refs/tags/vX.Y.Z になり、GoReleaser と release.yml がそれを読む。
  #
  # release.yml は sdk/vX.Y.Z が同じコミットにあることを検査するので、
  # sdk-tag の後に起動する。sdk-tag が飛ばされたか失敗したら、このジョブも
  # 走らない(if を書かないときの既定)。
  release:
    name: Start the release
    needs: [tagpr, sdk-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # workflow_dispatch
    steps:
      - name: Dispatch release.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
