<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ site.description | escape }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{{ '/' | relative_url }}">hokora</a>
  <nav>
    {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
    {% endfor %}
  </nav>
  <span class="spacer"></span>
  <a href="{{ site.repository_url }}">GitHub</a>
</header>

<main>
{{ content }}
</main>

<footer>
  <a href="{{ site.repository_url }}/blob/master/docs/{{ page.path }}">このページの原文(GitHub)</a>
</footer>
</body>
</html>
